name = "agrivoice"
main = "apps/api/src/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "agrivoice"
# Paste the id printed by `npx wrangler d1 create agrivoice` (see DEPLOY.md). Never commit secrets here.
database_id = "4c5e884c-33e9-45a9-baaa-8bdeaa8038ac"
migrations_dir = "migrations"

[vars]
DEMO_MODE = "0"
ENABLED_LANGUAGES = "en"
FORECAST_TTL_HOURS = "3"

[triggers]
# Daily retention job: purges sessions, rate limits and call-back numbers older than 30 days.
crons = ["17 3 * * *"]
